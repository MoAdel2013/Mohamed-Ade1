<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HEKAYA — Clothing</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f7f5f1;color:#111}header{position:sticky;top:0;z-index:10;background:#111;color:#fff;padding:16px 5%;display:flex;align-items:center;justify-content:space-between}.logo{font-weight:900;letter-spacing:5px;font-size:24px}.nav button{background:none;border:1px solid #555;color:#fff;border-radius:999px;padding:9px 14px;cursor:pointer}.hero{padding:70px 5% 45px;background:#111;color:#fff}.hero h1{font-size:clamp(44px,8vw,90px);margin:0;letter-spacing:-4px}.hero p{max-width:600px;color:#bbb;font-size:18px}.wrap{max-width:1200px;margin:auto;padding:40px 5%}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:22px}.card{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 8px 30px #00000012;cursor:pointer}.card img{width:100%;aspect-ratio:4/5;object-fit:cover;background:#ddd}.card .info{padding:16px}.tag{font-size:12px;letter-spacing:2px;color:#777}.price{font-weight:800;margin-top:8px}.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.panel{background:#fff;max-width:900px;width:100%;max-height:92vh;overflow:auto;border-radius:22px;padding:22px}.close{float:right;border:0;background:#eee;border-radius:50%;width:36px;height:36px;font-size:20px}.detail{display:grid;grid-template-columns:1fr 1fr;gap:28px}.detail img{width:100%;border-radius:16px}.sizes{display:flex;gap:8px;flex-wrap:wrap}.size{padding:12px 18px;border:1px solid #bbb;background:#fff;border-radius:10px;cursor:pointer}.size.active{background:#111;color:#fff}.buy{width:100%;padding:15px;background:#111;color:#fff;border:0;border-radius:12px;font-weight:800;cursor:pointer;margin-top:20px}form{display:grid;gap:12px}input,textarea{padding:14px;border:1px solid #ccc;border-radius:10px;font:inherit}textarea{min-height:100px}.notice{padding:14px;background:#f0eee9;border-radius:12px;margin:10px 0;font-size:14px}.thanks{text-align:center;padding:45px 10px}.check{font-size:55px}footer{padding:35px 5%;background:#111;color:#aaa;text-align:center}@media(max-width:700px){.detail{grid-template-columns:1fr}.hero{padding-top:45px}}</style></head><body><header><div class="logo">HEKAYA</div><div class="nav"><button onclick="showAccount()">Account</button></div></header><section class="hero"><h1>HEKAYA</h1><p>Egyptian streetwear. Select a piece, choose your size, and leave your details. Prices are coming soon.</p></section><main class="wrap"><h2>Collection</h2><div id="grid" class="grid"></div></main><footer>HEKAYA · Cairo · Prices Coming Soon</footer><div id="modal" class="modal"><div class="panel"><button class="close" onclick="closeModal()">×</button><div id="content"></div></div></div><script>
const products=[
["1","HEKAYA Tee — White","first_picture_alone.png"],
["2","HEKAYA Oversized Tee — Green","eighth_picture (4).png"],
["3","HEKAYA Hoodie — Cream","fifth_picture_alone.png"],
["4","HEKAYA Tee — Old Cairo","fourth_picture.png"],
["5","HEKAYA Hoodie — Brown","second_picture_alone.png"],
["6","HEKAYA Hoodie — Cairo Back Print","ninth_picture.png"],
["7","HEKAYA Tee — Green Back Print","third_picture_alone.png"],
["8","HEKAYA Long Sleeve — Old Cairo","seventh_picture.png"],
["9","HEKAYA Long Sleeve — Dark","eleventh_picture.png"],
["10","HEKAYA Hoodie — Cream Sunset","sixth_picture_alone.png"]
];let selected=null;const grid=document.getElementById("grid");products.forEach(p=>grid.innerHTML+="<article class='card' onclick=\"details('"+p[0]+"')\"><img src='"+p[2]+"' alt='"+p[1]+"'><div class='info'><div class='tag'>HEKAYA / NEW</div><h3>"+p[1]+"</h3><div class='price'>Coming Soon</div></div></article>");function openModal(h){document.getElementById("content").innerHTML=h;document.getElementById("modal").style.display="flex"}function closeModal(){document.getElementById("modal").style.display="none"}function details(id){let p=products.find(x=>x[0]===id);selected={p:p,size:"M"};let ss=["XS","S","M","L"].map(s=>"<button class='size "+(s==="M"?"active":"")+"' onclick=\"chooseSize('"+s+"',this)\">"+s+"</button>").join("");openModal("<div class='detail'><div><img src='"+p[2]+"'></div><div><div class='tag'>HEKAYA / PRODUCT "+p[0]+"</div><h1>"+p[1]+"</h1><p>Size: <b id='chosen'>M</b></p><div class='sizes'>"+ss+"</div><div class='notice'>Price for selected size: <b id='selectedPrice'>Coming Soon</b></div><button class='buy' onclick='checkout()'>Buy Now</button></div></div>")}function chooseSize(s,el){selected.size=s;document.querySelectorAll(".size").forEach(x=>x.classList.remove("active"));el.classList.add("active");document.getElementById("chosen").textContent=s;document.getElementById("selectedPrice").textContent="Coming Soon"}function checkout(){let p=selected.p;openModal("<h2>Customer details</h2><div class='notice'>Selected: <b>"+p[1]+"</b> · Size <b>"+selected.size+"</b> · Price <b>Coming Soon</b></div><form onsubmit='submitOrder(event)'><input required name='government' placeholder='Government / Governorate'><input required name='building' placeholder='Villa / Apartment / Company'><input name='compound' placeholder='Compound (if any)'><input required name='address' placeholder='Specific location / address'><input required name='phone' type='tel' placeholder='Phone number'><textarea name='comment' placeholder='Leave a comment'></textarea><button class='buy'>Confirm order</button></form>")}function submitOrder(e){e.preventDefault();let f=new FormData(e.target),o=Object.fromEntries(f);o.product=selected.p[1];o.size=selected.size;o.price="Coming Soon";o.date=new Date().toISOString();localStorage.setItem("hekayaLastOrder",JSON.stringify(o));openModal("<div class='thanks'><div class='check'>✓</div><h2>Thank you!</h2><p>We received your details.</p><p>We will send you a message soon.</p></div>")}function showAccount(){let o=JSON.parse(localStorage.getItem("hekayaLastOrder")||"null");openModal("<h2>HEKAYA Account</h2><p>Your recent activity is saved on this device.</p>"+(o?"<div class='notice'><b>Last order</b><br>"+o.product+" · "+o.size+" · "+o.price+"</div>":"<p>No saved activity yet.</p>"))}window.onclick=e=>{if(e.target.id==="modal")closeModal()};</script></body></html>
